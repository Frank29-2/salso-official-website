
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALSO | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #f4f4f4;
            font-family: Georgia, serif;
        }
        .admin-container {
            max-width: 850px;
            margin: 60px auto;
            padding: 25px;
        }
        .admin-card {
            background: white;
            padding: 30px;
            border-top: 5px solid #790d19;
            border-radius: 6px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }
        .admin-card h1 {
            color: #790d19;
            margin-top: 0;
        }
        .admin-card input,
        .admin-card textarea,
        .admin-card select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font: inherit;
        }
        .admin-card textarea {
            min-height: 150px;
        }
        .admin-btn {
            background: #790d19;
            color: white;
            padding: 12px 22px;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .admin-btn:hover {
            background: #510711;
        }
        #dashboard, #login-error {
            display: none;
        }
        .admin-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .news-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }
        .news-item button {
            margin: 5px 5px 5px 0;
        }
        #login-error {
            color: #b00020;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="admin-container">

    <section class="admin-card" id="login-section">
        <h1>SALSO Administration</h1>
        <p>Sign in to manage official SALSO news and updates.</p>

        <form id="login-form">
            <label>Email Address</label>
            <input type="email" id="admin-email" required>

            <label>Password</label>
            <input type="password" id="admin-password" required>

            <button type="submit" class="admin-btn">Login</button>
        </form>

        <p id="login-error"></p>
    </section>

    <section class="admin-card" id="dashboard">
        <div class="admin-top">
            <h1>Admin Dashboard</h1>
            <button class="admin-btn" id="logout-btn">Logout</button>
        </div>

        <p>Manage SALSO official news and announcements.</p>

        <hr>

        <h2 id="form-heading">Publish News</h2>

        <form id="news-form">
            <label>News Title</label>
            <input type="text" id="news-title" required>

            <label>News Content</label>
            <textarea id="news-content" required></textarea>

            <label>Upload News Image</label>
<input
    type="file"
    id="news-image"
    accept="image/*"
>
<p style="font-size:13px;color:#666;">
    Select an image from your computer.
</p>

            <label>Publication Status</label>
            <select id="news-status">
                <option value="published">Publish</option>
                <option value="draft">Save as Draft</option>
            </select>

            <button type="submit" class="admin-btn" id="save-news-btn">
                Save News
            </button>
            <button type="button" class="admin-btn" id="cancel-edit-btn" style="display:none;">
                Cancel Edit
            </button>
        </form>

        <hr>

        <h2>Manage Published News & Drafts</h2>
        <div id="news-list">Loading news...</div>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js" defer></script>

</body>
</html>
